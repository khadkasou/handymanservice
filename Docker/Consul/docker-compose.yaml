services:
  consul:
    image: hashicorp/consul:1.22
    container_name: consul-server
    restart: unless-stopped
#    networks:
#      - backend
    ports:
      - "8500:8500"
      - "8600:8600/tcp"
      - "8600:8600/udp"
    command: "agent -config-dir=/consul/config"
    volumes:
      - ./consul-config:/consul/config
      - consul-data:/consul/data  # Persistent volume for Consul data
    environment:
      - CONSUL_BIND_INTERFACE=eth0
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8500/v1/status/leader || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  consul-data:
    driver: local

#networks:
#  backend:
#    external: true # Tells Docker this network already exists outside this file