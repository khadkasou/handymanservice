plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.0'
    id 'io.spring.dependency-management' version '1.1.7'
//    id "org.sonarqube" version "6.0.1.5171"
}

group = 'com.nepbrain.technology'
version = '0.0.1-SNAPSHOT'
description = 'Bucket Service'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2025.1.0")
}
//sonar {
//    properties {
//        property "sonar.projectKey", "remit-v2_Backend_bucket-service_bd8cf51b-1384-432c-bf09-ed096c6b73f8"
//        property "sonar.projectName", "Bucket Service"
//    }
//}

dependencies {
    implementation 'io.minio:minio:8.6.0'
    implementation 'software.amazon.awssdk:s3:2.39.5'
    implementation 'software.amazon.awssdk:auth:2.39.5'
    implementation 'software.amazon.awssdk:sesv2:2.40.8'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.modelmapper:modelmapper:3.2.6'
    implementation 'org.springframework.boot:spring-boot-starter-test'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:3.0.0'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    implementation 'org.apache.groovy:groovy-templates:4.0.18'
    implementation 'org.apache.commons:commons-csv:1.14.1'
    implementation 'com.google.firebase:firebase-admin:9.7.0'
    implementation 'com.warrenstrange:googleauth:1.2.0'
    implementation 'dev.samstevens.totp:totp:1.7.1'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-discovery'
    implementation 'com.github.ulisesbocchio:jasypt-spring-boot-starter:3.0.5'
    implementation 'com.zaxxer:HikariCP:6.0.0'
    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    testImplementation 'org.springframework.security:spring-security-test'
    runtimeOnly 'org.postgresql:postgresql'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

compileJava {
    options.fork = true
    options.forkOptions.jvmArgs += ['--sun-misc-unsafe-memory-access=allow']
    options.compilerArgs += [
            '-Amapstruct.defaultComponentModel=spring'
    ]
}

