spring:
  application:
    name: ${BUCKET_SERVICE:Bucket-Service}
  datasource:
    # PostgreSQL only — do NOT map REDIS_PASSWORD / REDIS_USER here (see spring.data.redis below).
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME_BUCKET:${DB_NAME_COMMUNICATION:bucket}}
    username: ${POSTGRES_USER:${DB_USERNAME:postgres}}
    password: ${POSTGRES_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: BucketHikariPool
      maximum-pool-size: 10
      minimum-idle: 5
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  http:
    codecs:
      max-in-memory-size: 500MB
  security:
    oauth2:
      resourceserver:
        opaque-token:
          introspection-uri: ${AUTH_INTROSPECT_URL:http://localhost:8000/oauth2/introspect}
          client-id: ${AUTH_CLIENT_ID:client}
          client-secret: ${AUTH_CLIENT_SECRET:${AUTH_SECRET:secret}}
  cloud:
    consul:
      host: ${CONSUL_HOST}
      port: ${CONSUL_PORT}
      discovery:
        enabled: true
        service-name: ${spring.application.name}
        instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
        prefer-ip-address: true
        acl-token: ${CONSUL_ACL_TOKEN}
        health-check-path: /actuator/health
        health-check-interval: 10s
        health-check-critical-timeout: 3m
