syntax = "proto3";

package com.nepbrain.technology.axcessfoundation.communication.grpc;

option java_multiple_files = true;
option java_package = "com.nepbrain.technology.axcessfoundation.communication.grpc";
option java_outer_classname = "CommunicationTemplateProto";

service CommunicationTemplateService {
  rpc SendTemplateEmail (SendTemplateEmailRequest) returns (SendTemplateEmailResponse);
  rpc SendTemplateNotification (SendTemplateNotificationRequest) returns (SendTemplateEmailResponse);
  rpc SendBulk (BulkSendGrpcRequest) returns (SendTemplateEmailResponse);
  rpc SendExplicitEmail (SendExplicitEmailRequest) returns (SendTemplateEmailResponse);
  rpc CreateUserNotification (CreateUserNotificationGrpcRequest) returns (SendTemplateEmailResponse);
  rpc ListUserNotifications (ListUserNotificationsGrpcRequest) returns (ListUserNotificationsGrpcResponse);
  rpc GetUserNotificationUnreadCount (UserNotificationUserGrpcRequest) returns (UserNotificationUnreadCountGrpcResponse);
  rpc MarkUserNotificationRead (MarkUserNotificationReadGrpcRequest) returns (SendTemplateEmailResponse);
  rpc MarkAllUserNotificationsRead (UserNotificationUserGrpcRequest) returns (SendTemplateEmailResponse);
}

message SendTemplateEmailRequest {
  string username = 1;
  string email = 2;
  string name = 3;
  string topic = 4;
  string language = 5;
  map<string, string> data = 6;
  string company_id = 7;
  string mobile = 8;
}

message SendTemplateEmailResponse {
  bool success = 1;
  string message = 2;
}

message SendExplicitEmailRequest {
  string email = 1;
  string subject = 2;
  string body = 3;
  string company_id = 4;
  string username = 5;
}

message SendTemplateNotificationRequest {
  string username = 1;
  string email = 2;
  string topic = 3;
  string language = 4;
  map<string, string> data = 5;
  repeated string tokens = 6;
  string company_id = 7;
}

enum BulkTargetType {
  BULK_TARGET_ALL = 0;
  BULK_TARGET_ROLE = 1;
  BULK_TARGET_SELECTED = 2;
}

message BulkSendGrpcRequest {
  BulkTargetType target_type = 1;
  repeated string role_ids = 2;
  repeated string user_ids = 3;
  bool send_email = 4;
  bool send_sms = 5;
  bool send_notification = 6;
  string email_subject = 7;
  string email_body = 8;
  string sms_body = 9;
  string notification_title = 10;
  string notification_body = 11;
  string company_id = 12;
}

message CreateUserNotificationGrpcRequest {
  string recipient_user_id = 1;
  string title = 2;
  string body = 3;
  string topic = 4;
  string reference_type = 5;
  string reference_id = 6;
  string notification_type = 7;
  string category = 8;
  string request_type = 9;
  string request_id = 10;
  string request_number = 11;
  string workflow_history_id = 12;
  string action_url = 13;
  string action_label = 14;
  string company_id = 15;
  string branch_id = 16;
  string recipient_employee_id = 17;
  string channel = 18;
  string metadata = 19;
}

message ListUserNotificationsGrpcRequest {
  string user_id = 1;
  int32 page_no = 2;
  int32 page_size = 3;
  // 0 = unset, 1 = unread only, 2 = read only
  int32 read_filter = 4;
  bool exclude_company_notice = 5;
  string search = 6;
  string sort_by = 7;
  string sort_direction = 8;
}

message UserNotificationGrpcItem {
  string id = 1;
  string title = 2;
  string body = 3;
  bool read = 4;
  string topic = 5;
  string notification_type = 6;
  string category = 7;
  string request_type = 8;
  string request_id = 9;
  string action_url = 10;
  string created_at = 11;
  string read_at = 12;
  string reference_type = 13;
  string reference_id = 14;
  string action_label = 15;
  string metadata = 16;
  string recipient_employee_id = 17;
}

message ListUserNotificationsGrpcResponse {
  bool success = 1;
  string message = 2;
  repeated UserNotificationGrpcItem items = 3;
  int64 total_elements = 4;
  int64 unread_count = 5;
}

message UserNotificationUserGrpcRequest {
  string user_id = 1;
  bool exclude_company_notice = 2;
}

message UserNotificationUnreadCountGrpcResponse {
  bool success = 1;
  string message = 2;
  int64 unread_count = 3;
}

message MarkUserNotificationReadGrpcRequest {
  string user_id = 1;
  string notification_id = 2;
}
