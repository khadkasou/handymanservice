spring:
  application:
    name: ${COMMUNICATION_SERVICE:communication-service}
  # OAuth2 resource server disabled: main chain uses permitAll to avoid introspect 401/NPE
  security:
     oauth2:
       resourceserver:
         opaque-token:
           introspection-uri: ${AUTH_INTROSPECT_URL:http://localhost:8000/oauth2/introspect}
           client-id: ${AUTH_CLIENT_ID:client}
           client-secret: ${AUTH_CLIENT_SECRET:secret}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME_COMMUNICATION:communication}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: MyHikariCP
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      timeout: 2000
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 1000
  cache:
    type: redis
    redis:
      cache-null-values: false
      time-to-live: 43200000
      use-key-prefix: true
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        enabled: true
        service-name: ${spring.application.name}
        instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
        prefer-ip-address: true
        acl-token: ${CONSUL_ACL_TOKEN:}
        health-check-path: /actuator/health
        health-check-interval: 10s
        health-check-critical-timeout: 3m
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health, info, metrics
        exclude: env, shutdown
  endpoint:
    health:
      show-details: always
      enabled: true
    info:
      enabled: true
    metrics:
      enabled: true

otp:
  length: 4
  expiry-time-second: 600

server:
  port: ${SERVER_PORT_COMMUNICATION_SERVICE:8011}
  url: ${SERVER_URL:http://localhost:8011}
  max-http-request-header-size: 30KB

grpc:
  server:
    address: ${GRPC_SERVER_ADDRESS:0.0.0.0}
    port: ${COMMUNICATION_GRPC_PORT:8911}
  client:
    user-service:
      address: ${USER_GRPC_ADDRESS:static://localhost:8901}
      negotiationType: PLAINTEXT
