plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id "org.sonarqube" version "6.0.1.5171"
    id 'com.google.protobuf' version '0.9.4'
}

group = 'com.nepbrain.technology'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}
sonar {
    properties {
        property "sonar.projectKey", "remit-v2_Backend_communication-service_2a3f12b1-c148-4346-9c50-ae3755743651"
        property "sonar.projectName", "Communication Service"
    }
}

ext {
    set('springCloudVersion', "2025.1.0")
}

dependencies {
    implementation 'org.apache.groovy:groovy-templates:4.0.18'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-test'
    implementation 'io.projectreactor.addons:reactor-extra:3.5.1'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'com.google.firebase:firebase-admin:9.7.0'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'
    implementation 'io.hypersistence:hypersistence-utils-hibernate-71:3.14.0'
    implementation 'software.amazon.awssdk:sesv2:2.40.8'
    implementation 'org.hibernate.orm:hibernate-envers'
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'
    implementation 'commons-codec:commons-codec:1.15'
    implementation 'org.apache.commons:commons-csv:1.14.1'
    implementation 'com.warrenstrange:googleauth:1.2.0'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'dev.samstevens.totp:totp:1.7.1'
    implementation 'org.modelmapper:modelmapper:3.2.5'
    implementation 'com.zaxxer:HikariCP:7.0.2'
    implementation 'org.quartz-scheduler:quartz:2.3.2'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-discovery'
    testImplementation 'io.projectreactor:reactor-test'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'com.github.ulisesbocchio:jasypt-spring-boot-starter:3.0.5'
    implementation 'org.springframework:spring-aop'
    // gRPC server + client dependencies
    implementation 'net.devh:grpc-spring-boot-starter:3.1.0.RELEASE'
    implementation 'net.devh:grpc-client-spring-boot-starter:3.1.0.RELEASE'
    implementation 'io.grpc:grpc-netty-shaded:1.78.0'
    implementation 'io.grpc:grpc-protobuf:1.78.0'
    implementation 'io.grpc:grpc-stub:1.78.0'
    implementation 'com.google.protobuf:protobuf-java:4.33.4'
    implementation 'org.apache.tomcat:tomcat-annotations-api:11.0.15'

}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:4.33.4"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:1.78.0"
        }
    }
    generateProtoTasks {
        all().forEach { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}

sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/grpc'
            srcDirs 'build/generated/source/proto/main/java'
        }
    }
}

compileJava {
    options.compilerArgs += [
            '-Amapstruct.defaultComponentModel=spring'
    ]
}
