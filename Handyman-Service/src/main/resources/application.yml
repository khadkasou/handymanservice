spring:
  application:
    name: Handyman-Service
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        enabled: true
        service-name: ${spring.application.name}
        instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
        prefer-ip-address: true
        acl-token: ${CONSUL_ACL_TOKEN:}
        health-check-path: /actuator/health
        health-check-interval: 10s
        health-check-critical-timeout: 3m
  datasource:
    url: jdbc:postgresql://localhost:5432/handyman
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: HandymanHikariCP
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      org:
        hibernate:
          envers:
            audit_table_suffix: _AUDIT
  jackson:
    default-property-inclusion: non_null
    # Do not set spring.jackson.serialization.* - Jackson 3 (Spring Boot 4) removed WRITE_DATES_AS_TIMESTAMPS;
    # date format is configured in GeneralConfig via ObjectMapper + JavaTimeModule.
    deserialization:
      fail-on-unknown-properties: false
  security:
    oauth2:
      resourceserver:
        opaque-token:
          introspection-uri: http://localhost:8080/oauth2/introspect
          client-id: ${AUTH_CLIENT_ID:client}
          client-secret: ${AUTH_CLIENT_SECRET:secret}
  kafka:
    producer:
      bootstrap-servers: 172.20.23.45:9092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      group-id: notification_group

server:
  port: 8020
  url: http://localhost:${server.port}
  max-http-request-header-size: 300KB

resilience4j:
  circuitbreaker:
    instances:
      remittance-service:
        register-health-indicator: true
        event-consumer-buffer-size: 100
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        ignore-exceptions:
          - java.lang.Exception
          - java.lang.RuntimeException
    circuit-breaker-aspect-order: 1
  retry:
    instances:
      remittance-service:
        max-attempts: 3
        wait-duration: 5s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        ignore-exceptions:
          - java.lang.Exception
          - java.lang.RuntimeException

kafka:
  topic:
    notification: NOTIFICATION-LOCAL
    login: LOGIN-LOCAL
    application: APPLICATION-LOCAL

aes:
  encryption:
    algorithm: AES
    padding: AES/ECB/PKCS5Padding
    secretKey: ${ENCRYPTION_SECRET_KEY:LchiQkmHkgmjgOEF}
    xsrfToken: ${ENCRYPTION_XSRF_TOKEN:ENC(0GkBA/rY3i+QQk1UJ1qFGWYZ+A6QYPCBEMUbCYmSmpxhD73HQuvwlLvEUYyvNENdLm/xgD56X2hV/PnzuuS1nA==)}

